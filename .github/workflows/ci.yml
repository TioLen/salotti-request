name: CI SalottiRequest

on:
  push:
    branches: ["main"]

jobs:
  validar:
    runs-on: 'ubuntu-latest'
    steps:
        - name: Baixar código
          uses: actions/checkout@v4

        - name: Configurar Node
          uses: actions/setup-node@v4
          with:
            node-version: 20
        
        - name: Instalar dependências
          run: npm install 

        - name: Rodar Testes
          run: npm test --if-present

        - name: Rodar aplicação
          run: node index.js